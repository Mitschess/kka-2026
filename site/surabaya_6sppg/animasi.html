<title>Animasi Rute MBG</title>

<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f1; --surface: #ffffff; --surface-2: #f1f0ec; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781; --line: #e4e3dd;
    --btn: #0b0b0b; --btn-ink: #ffffff; --hover: rgba(11, 11, 11, .05); --ring: rgba(11, 11, 11, .10);
    --hl: #fff1c2; --hl-ink: #5c4100; --hl-bar: #eda100; --code-bg: #fbfbf9;
    --good: #0ca30c; --good-ink: #006300; --warn: #fab219; --bad: #d03b3b;
    --glass: rgba(255, 255, 255, .9); --shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 12px 30px -12px rgba(0, 0, 0, .18);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  button, select, input { font: inherit; color: var(--ink); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .home { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink-2); font-weight: 600; font-size: 13px;
          padding: 6px 10px 6px 6px; border-radius: 10px; border: 1px solid var(--line); transition: border-color .15s, color .15s; }
  .home:hover { color: var(--ink); border-color: var(--muted); }
  .home svg { width: 22px; height: 22px; }
  .title { font-weight: 800; font-size: 15px; letter-spacing: -.01em; flex: 1 1 160px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title span { font-weight: 500; color: var(--muted); font-size: 13px; }
  .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button { border: 0; background: transparent; color: var(--ink-2); font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 8px;
                cursor: pointer; white-space: nowrap; transition: background .15s, color .15s, box-shadow .15s; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 0 0 1px var(--ring); }
  .tabs button.on { background: var(--btn); color: var(--btn-ink); box-shadow: none; }
  .iconbtn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer;
             display: inline-grid; place-items: center; flex-shrink: 0; color: var(--ink); }
  .iconbtn:hover { border-color: var(--muted); }
  .iconbtn svg { width: 17px; height: 17px; }
  .iconbtn[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }

  main { flex: 1; display: flex; min-height: 0; }
  #mapwrap { flex: 1; position: relative; min-width: 0; }
  #map { position: absolute; inset: 0; background: var(--surface-2); }
  .leaflet-container { font: inherit; }
  .leaflet-tooltip { font-size: 12.5px; border-radius: 9px; padding: 6px 10px; border: 0; box-shadow: 0 6px 20px rgba(0, 0, 0, .18); }
  .leaflet-bar a { background: var(--surface); color: var(--ink); border-color: var(--line) !important; }
  .leaflet-control-attribution { background: var(--glass) !important; color: var(--muted); }
  aside { width: 440px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: auto; }
  body.nocode aside { display: none; }
  .sec { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .sec h3 { margin: 0 0 10px; font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted);
            display: flex; align-items: center; gap: 8px; }
  ol#code { margin: 0; padding: 8px 0; list-style: none; counter-reset: ln; background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px;
            font: 12.5px/1.65 "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace; }
  ol#code li { counter-increment: ln; padding: 2px 10px 2px 0; white-space: pre-wrap; display: flex; border-left: 3px solid transparent;
               transition: background .2s, color .2s, border-color .2s; }
  ol#code li::before { content: counter(ln); width: 32px; flex-shrink: 0; text-align: right; padding-right: 12px; color: var(--muted); opacity: .7; }
  ol#code li.on { background: var(--hl); color: var(--hl-ink); border-left-color: var(--hl-bar); font-weight: 600; }
  ol#code li.on::before { color: var(--hl-bar); opacity: 1; }
  #msg { min-height: 44px; font-size: 14px; font-weight: 500; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border-left: 3px solid var(--ink); }
  #msg.pop { animation: msgpop .35s ease; }
  @keyframes msgpop { from { transform: translateY(3px); opacity: .4; } to { transform: none; opacity: 1; } }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  #info { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #info .tile { border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px 8px; min-width: 0; }
  #info .tile span { display: block; font-size: 11.5px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #info .tile b { display: block; font-size: 15px; font-weight: 800; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #info .tile .meter { height: 4px; border-radius: 2px; background: var(--surface-2); margin-top: 5px; overflow: hidden; }
  #info .tile .meter i { display: block; height: 100%; background: var(--good); border-radius: 2px; transition: width .25s; }
  #log { max-height: 240px; overflow: auto; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  #log div { padding: 4px 0; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  #log div:first-child { font-weight: 700; animation: msgpop .3s ease; }
  #log .t { color: var(--muted); font-weight: 600; min-width: 42px; }
  #log i { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .clock0 { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
  .clock0 input { padding: 2px 6px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }

  footer { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--line); }
  footer .btns { display: flex; gap: 6px; align-items: center; }
  footer .btns button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer;
                        display: grid; place-items: center; transition: border-color .15s, transform .1s; }
  footer .btns button:hover { border-color: var(--muted); }
  footer .btns button:active { transform: scale(.94); }
  footer .btns svg { width: 15px; height: 15px; }
  #bPlay { width: 48px; height: 48px; background: var(--btn); color: var(--btn-ink); border-color: var(--btn); box-shadow: 0 6px 18px -6px rgba(0, 0, 0, .4); }
  #bPlay svg { width: 18px; height: 18px; }
  input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; height: 22px; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px;
    background: linear-gradient(90deg, var(--ink) var(--p, 0%), var(--surface-2) var(--p, 0%)); border: 1px solid var(--line); }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); }
  input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--ink); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; margin-top: -6px;
    background: var(--surface); border: 2px solid var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .25); }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); }
  #scrub { flex: 1; min-width: 160px; }
  #pos { color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 128px; font-weight: 600; font-size: 13px; }
  footer label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
  #speed { width: 110px; }
  #speedVal { min-width: 76px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .keys { color: var(--muted); font-size: 12px; }
  .keys kbd { font: 600 11px "JetBrains Mono", ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--surface-2); }

  #hud { position: absolute; top: 12px; left: 56px; z-index: 500; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
         border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px 12px; box-shadow: var(--shadow); min-width: 230px;
         font-variant-numeric: tabular-nums; pointer-events: none; max-width: calc(100% - 70px); }
  #hud .sm { color: var(--ink-2); font-size: 12.5px; }
  #hud .big { font-size: 26px; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; }
  #hud .bar { height: 5px; border-radius: 3px; background: var(--surface-2); margin-top: 8px; overflow: hidden; }
  #hud .bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--ink); }
  #hud.done .bar i { background: var(--good); }
  #hud .ok { display: none; color: var(--good-ink); font-weight: 700; font-size: 12.5px; margin-top: 4px; }
  #hud.done .ok { display: block; }
  #legend { position: absolute; right: 12px; bottom: 24px; z-index: 500; background: var(--glass); backdrop-filter: blur(8px);
            border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 12px; font-weight: 600; color: var(--ink-2); display: grid; gap: 3px; }
  #legend div { display: flex; align-items: center; gap: 7px; }
  #legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .depot { width: 40px; height: 24px; border-radius: 8px; color: #fff; font: 800 10.5px/20px "Plus Jakarta Sans", system-ui, sans-serif;
           text-align: center; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .35); }
  .van { position: relative; }
  .van svg { display: block; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .4)); transition: transform .15s; }
  .van b { position: absolute; top: -9px; right: -7px; background: #0b0b0b; color: #fff; border-radius: 9px; border: 1.5px solid #fff;
           font: 800 9.5px/14px "Plus Jakarta Sans", system-ui, sans-serif; min-width: 17px; text-align: center; padding: 0 3px; }
  .van.done { opacity: .4; }
  .ripple { width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--c); animation: ripple 1.1s ease-out forwards; pointer-events: none; }
  @keyframes ripple { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
  @media (max-width: 820px) {
    html, body { height: auto; }
    body { display: block; }
    header { padding: 8px 12px; gap: 8px; }
    .home { order: 0; padding-right: 6px; } .home span { display: none; }
    .title { order: 1; } .title span { display: none; }
    .iconbtn { order: 2; }
    .tabs { order: 3; flex: 1 1 auto; } .tabs button { flex: 1; }
    #algo { order: 4; flex: 1 1 100%; }
    main { display: block; }
    #mapwrap { height: 58vh; min-height: 340px; }
    aside { width: auto; border-left: 0; border-top: 1px solid var(--line); max-height: none; overflow: visible; }
    #hud { left: 52px; min-width: 0; padding: 8px 12px 10px; }
    #hud .big { font-size: 20px; }
    #legend, .keys { display: none; }
    footer { position: sticky; bottom: 0; z-index: 1000; gap: 6px 10px; padding: 8px 12px; box-shadow: 0 -8px 24px -12px rgba(0, 0, 0, .25); }
    footer .btns button { width: 34px; height: 34px; }
    #bPlay { width: 42px; height: 42px; }
    #scrub { flex: 1 1 120px; min-width: 0; }
    #pos { min-width: 0; font-size: 12px; }
    #speed { width: 90px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

</main>
<footer>
  <div class="btns">
    <button id="bReset" title="Ulang dari awal" aria-label="Ulang"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5v11M13 3.2v9.6a.5.5 0 0 1-.8.4L5.6 8.4a.5.5 0 0 1 0-.8l6.6-4.8a.5.5 0 0 1 .8.4z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
    <button id="bBack" title="Langkah sebelumnya" aria-label="Mundur"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 3L5.5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="bPlay" title="Putar / jeda (spasi)" aria-label="Putar"></button>
    <button id="bFwd" title="Langkah berikutnya" aria-label="Maju"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <input type="range" id="scrub" min="0" max="100" value="0" aria-label="Posisi animasi">
  <span id="pos"></span>
  <label>Kecepatan <input type="range" id="speed" min="0" max="9" value="4" aria-label="Kecepatan"><span id="speedVal"></span></label>
  <span class="keys"><kbd>spasi</kbd> putar · <kbd>←</kbd><kbd>→</kbd> langkah</span>
</footer>

window.addEventListener("error", (e) => {
  const b = document.createElement("div");

  b.textContent = "Error: " + e.message + (typeof L === "undefined" ? " — Leaflet gagal dimuat, cek koneksi internet." : "");
  document.body.appendChild(b); document.title = "ERROR " + e.message;
});
</script>

const store = {

const S = { stage: 1, algoRoute: "A*", frame: 0, t: 0, playing: false, last: 0, acc: 0 };

// ------------------------------------------------------------------ ikon
const ICON = {
  play: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4a.6.6 0 0 0 .9.5l8.3-5.2a.6.6 0 0 0 0-1L5.4 2.3a.6.6 0 0 0-.9.5z" fill="currentColor"/></svg>',
  pause: '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="2.5" width="3.2" height="11" rx="1" fill="currentColor"/><rect x="9.3" y="2.5" width="3.2" height="11" rx="1" fill="currentColor"/></svg>',
};

// ------------------------------------------------------------------ peta
const map = L.map("map", { preferCanvas: true, zoomSnap: 0.25 });
let tiles = [];
function setTiles() {
  tiles.forEach((t) => map.removeLayer(t));
  const url = (x) => `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_${x}/MapServer/tile/{z}/{y}/{x}`;
  tiles = [L.tileLayer(url("Base"), { maxNativeZoom: 16, maxZoom: 19, attribution: "Tiles &copy; Esri" }),
    L.tileLayer(url("Reference"), { maxNativeZoom: 16, maxZoom: 19, opacity: 0.8 })];
  tiles.forEach((t) => t.addTo(map).bringToBack());
}
setTiles();
map.fitBounds(L.latLngBounds(NODES.map((n) => [n.lat, n.lon])).pad(0.08));
const schoolFill = () => "#ffffff";

const roadLayer = L.layerGroup().addTo(map);
const routeLayer = L.layerGroup().addTo(map);
const schoolLayer = L.layerGroup().addTo(map);
const depotLayer = L.layerGroup().addTo(map);
const fxLayer = L.layerGroup().addTo(map);
const vanLayer = L.layerGroup().addTo(map);

const schoolMk = [];
for (let s = 0; s < N; s++) {
  const mk = L.circleMarker(ll(M + s), { radius: 6, weight: 2.5, color: "#9a9a96", fillColor: "#ffffff", fillOpacity: 1 })
    .bindTooltip(NODES[M + s].name).addTo(schoolLayer);
  schoolMk.push(mk);
}
for (let d = 0; d < M; d++) {
  const short = NODES[d].id.replace("SPPG-", "");
  L.marker(ll(d), { icon: L.divIcon({ className: "", html: `<div class="depot" style="background:${color(d)}">${esc(short)}</div>`,
    iconSize: [40, 24], iconAnchor: [20, 12] }), zIndexOffset: 1000 })
    .bindTooltip(`${NODES[d].id}: ${NODES[d].name}`).addTo(depotLayer);
}
$("legend").innerHTML = NODES.slice(0, M).map((n, d) => `<div><i style="background:${color(d)}"></i>${esc(n.id)}</div>`).join("")
  + `<div><i style="background:transparent;border:2px solid #9a9a96;border-radius:50%"></i>belum dilayani</div>`;
function ripple(s, c) {
  const mk = L.marker(ll(M + s), { icon: L.divIcon({ className: "", html: `<div class="ripple" style="--c:${c}"></div>`, iconSize: [48, 48], iconAnchor: [24, 24] }),
    interactive: false, keyboard: false }).addTo(fxLayer);
  setTimeout(() => fxLayer.removeLayer(mk), 1150);
}

// ------------------------------------------------------------------ UI umum
$("sub").textContent = `· ${DATA.instance} · ${M} SPPG, ${N} sekolah, maks ${DATA.Q} sekolah/Granmax, w = ${DATA.w}`;
S.algoRoute = store.get("algoRoute", "A*");
if (!DATA.route[S.algoRoute]) S.algoRoute = Object.keys(DATA.route)[0];
function populateAlgo() {
  $("algo").replaceChildren(...Object.keys(DATA.route).map((a) => {
    const b = document.createElement("button");
    b.textContent = label(a);
    b.className = a === S.algoRoute ? "on" : "";
    b.setAttribute("aria-pressed", String(a === S.algoRoute));
    b.onclick = () => {
      if (a === S.algoRoute) return;
      S.algoRoute = a;
      store.set("algoRoute", a);
      enter();
    };
    return b;
  }));
}
$("speed").value = store.get("speed", "4");

function setCode(lines) {
  $("code").innerHTML = lines.map((l) => `<li>${esc(l)}</li>`).join("");
}
function highlight(line) {
  [...$("code").children].forEach((li, i) => li.classList.toggle("on", i === line));
  const on = $("code").children[line];
  // gulir hanya di dalam panel (layout desktop); di HP halaman yang bergulir, jangan tarik layar ke bawah
  if (on && !document.body.classList.contains("nocode") && WIDE.matches) on.scrollIntoView({ block: "nearest" });
}
function setMsg(text) {
  const el = $("msg");
  if (el.textContent === text) return;
  el.textContent = text;
  el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
}
function setInfo(obj) {
  $("info").innerHTML = Object.entries(obj).map(([k, v]) => {
    const frac = /^(\d+)\/(\d+)$/.exec(String(v));
    const meter = frac ? `<div class="meter"><i style="width:${(+frac[1] / +frac[2] * 100).toFixed(1)}%"></i></div>` : "";
    return `<div class="tile"><span>${esc(k)}</span><b>${esc(idFmt(v))}</b>${meter}</div>`;
  }).join("");
}
function setCodeHidden(hidden) {
  document.body.classList.toggle("nocode", hidden);
  $("toggleCode").title = hidden ? "Tampilkan panel kode" : "Sembunyikan panel kode";
  $("toggleCode").setAttribute("aria-label", $("toggleCode").title);
  $("toggleCode").setAttribute("aria-pressed", String(hidden));
  store.set("nocode", hidden ? "1" : "0");
  setTimeout(() => map.invalidateSize(), 50);
}
$("toggleCode").onclick = () => setCodeHidden(!document.body.classList.contains("nocode"));
function setProgress(frac) {
  const p = Math.max(0, Math.min(1, frac)) * 100;
  $("scrub").style.setProperty("--p", p.toFixed(2) + "%");
  const bar = document.querySelector("#hud .bar i");
  if (bar) bar.style.width = p.toFixed(2) + "%";
  $("hud").classList.toggle("done", frac >= 1);
}
function speedLabel() {

}

// ------------------------------------------------------------------ tahap 1: pencarian rute
// geometri jalan asli per ruas a -> b (OSRM); garis lurus hanya kalau datanya tidak ada
const LEGS = DATA.legs || {};
const leg = (a, b) => LEGS[a + "-" + b] || [ll(a), ll(b)];
function routePath(r) {
  const nodes = [r[0], ...r.slice(1).map((s) => M + s), r[0]], pts = [];
  for (let k = 0; k + 1 < nodes.length; k++) {
    const g = leg(nodes[k], nodes[k + 1]);
    pts.push(...(k ? g.slice(1) : g));
  }
  return pts;
}
function drawSearch() {
  const A = currentSet(), F = A.frames, f = F[S.frame];
  routeLayer.clearLayers();
  const owner = new Array(N).fill(-1);
  for (const r of f.r) {
    const over = r.length - 1 > DATA.Q;
    L.polyline(routePath(r), { color: color(r[0]), weight: 3.6, opacity: 0.92, dashArray: over ? "6 6" : null }).addTo(routeLayer);
    for (const s of r.slice(1)) owner[s] = r[0];
  }
  const hl = new Set(f.hl || []);
  schoolMk.forEach((mk, s) => {
    const c = owner[s] >= 0 ? color(owner[s]) : "#9a9a96";
    mk.setStyle({ color: hl.has(s) ? "#d62f2f" : c, weight: hl.has(s) ? 4 : 2.5, fillColor: schoolFill() });
    mk.setRadius(hl.has(s) ? 10 : 6);
  });
  highlight(f.l);
  setMsg(f.m);
  setInfo(f.i);
  const fv = f.i.f !== undefined ? `f = ${idFmt(f.i.f)}` : "";
  const big = f.i["Biaya bensin"] ? idFmt(f.i["Biaya bensin"]) : fv || "–";
  const last = S.frame === F.length - 1;
  $("hud").innerHTML = `<div class="sm">${esc(label(S.algoRoute))} · langkah ${S.frame + 1}/${F.length}</div>
    <div class="big">${esc(big)}</div>
    <div class="sm">${f.i["Rata-rata tiba"] ? "rata-rata tiba " + esc(idFmt(f.i["Rata-rata tiba"])) + " · " : ""}${f.i["Biaya bensin"] ? esc(fv) : ""}${f.i.Melanggar ? " · <b style='color:var(--bad)'>melanggar " + esc(f.i.Melanggar) + "</b>" : ""}</div>
    <div class="bar"><i></i></div><div class="ok">✓ ${last ? "Pencarian selesai, rute ditemukan" : ""}</div>`;
  $("scrub").max = F.length - 1; $("scrub").value = S.frame;
  $("pos").textContent = `langkah ${S.frame + 1} / ${F.length}`;
  setProgress(F.length > 1 ? S.frame / (F.length - 1) : 1);
}

// ------------------------------------------------------------------ tahap 2: pengiriman
let plan = null, events = [], gotPrev = new Set();
function segLengths(g) {
  const out = [0];
  for (let i = 1; i < g.length; i++) {
    const dy = g[i][0] - g[i - 1][0], dx = (g[i][1] - g[i - 1][1]) * Math.cos(g[i][0] * Math.PI / 180);
    out.push(out[i - 1] + Math.hypot(dx, dy));
  }
  return out;
}
function along(seg, frac) {
  const g = seg.g, cum = seg.cum, target = frac * cum[cum.length - 1];
  let i = 1;
  while (i < cum.length - 1 && cum[i] < target) i++;
  const span = cum[i] - cum[i - 1] || 1, u = (target - cum[i - 1]) / span;
  return [g[i - 1][0] + (g[i][0] - g[i - 1][0]) * u, g[i - 1][1] + (g[i][1] - g[i - 1][1]) * u, g[i][1] - g[i - 1][1]];
}
function vanIcon(c, num, flip, done) {
  return L.divIcon({ className: "", iconSize: [30, 22], iconAnchor: [15, 14], html:
    `<div class="van${done ? " done" : ""}"><svg width="30" height="22" viewBox="0 0 30 22" style="transform:scaleX(${flip ? -1 : 1})">
      <rect x="1" y="3" width="19" height="12" rx="2.5" fill="${c}" stroke="#fff" stroke-width="1.5"/>
      <path d="M20 6.5h4.5l4 4.5v4H20z" fill="${c}" stroke="#fff" stroke-width="1.5"/>
      <rect x="21.5" y="8" width="3.2" height="3" fill="#dff1ff"/>
      <circle cx="7" cy="17" r="3" fill="#222" stroke="#fff" stroke-width="1.2"/>
      <circle cx="23" cy="17" r="3" fill="#222" stroke="#fff" stroke-width="1.2"/></svg><b>${num}</b></div>` });
}
function clockStr(t) {
  const [h, m] = ($("clock0").value || "06:00").split(":").map(Number);
  const tot = Math.floor(h * 60 + m + t + 1e-6);
  return String(Math.floor(tot / 60) % 24).padStart(2, "0") + ":" + String(tot % 60).padStart(2, "0");
}
function setupDelivery() {
  plan = DATA.route[S.algoRoute].delivery;
  roadLayer.clearLayers(); vanLayer.clearLayers(); fxLayer.clearLayers(); events = []; gotPrev = new Set();
  for (const v of plan.veh) {
    for (const seg of v.segs) {
      seg.cum = segLengths(seg.g);
      L.polyline(seg.g, { color: color(v.d), weight: 4, opacity: 0.35, interactive: false }).addTo(roadLayer);
    }
    v.marker = L.marker(ll(v.d), { icon: vanIcon(color(v.d), v.v, false, false), zIndexOffset: 2000 })
      .bindTooltip(`Granmax ${v.v} (${NODES[v.d].id})`).addTo(vanLayer);
    v.flip = false; v.done = false; v._flip = undefined;
    for (const st of v.stops) {
      events.push({ t: st.arr, kind: "arr", v, s: st.s });
      events.push({ t: st.dep, kind: "dep", v, s: st.s });
    }
    events.push({ t: 0, kind: "go", v });
    events.push({ t: v.end, kind: "back", v });
  }
  events.sort((a, b) => a.t - b.t || (a.kind === "go" ? -1 : 1));
  plan.T = Math.max(...plan.veh.map((v) => v.end));
  plan.arr = new Map(plan.veh.flatMap((v) => v.stops.map((st) => [st.s, { t: st.arr, d: v.d, v: v.v }])));
}
function evText(e) {
  const g = `Granmax ${e.v.v}`;
  if (e.kind === "go") return `${g} berangkat dari ${NODES[e.v.d].id}`;
  if (e.kind === "arr") return `${g} tiba di ${NODES[M + e.s].name}`;
  if (e.kind === "dep") return `${g} selesai drop di ${NODES[M + e.s].name}`;
  return `${g} kembali ke ${NODES[e.v.d].id}`;
}
function drawDelivery() {
  const t = S.t;
  let moving = 0, toSchool = 0, returning = 0, serving = 0, done = 0, km = 0;
  for (const v of plan.veh) {
    let pos = ll(v.d), state = "idle", dx = 0;
    for (const seg of v.segs) {
      if (t >= seg.t1) { pos = ll(seg.b); km += seg.km; state = seg.b >= M ? "serve" : "home"; continue; }
      if (t >= seg.t0) {
        const p = along(seg, (t - seg.t0) / (seg.t1 - seg.t0 || 1));
        pos = [p[0], p[1]]; dx = p[2]; km += seg.km * (t - seg.t0) / (seg.t1 - seg.t0 || 1);
        state = seg.b >= M ? "go" : "ret";
      }
      break;
    }
    if (state === "serve") {
      const st = v.stops.find((x) => t >= x.arr && t < x.dep);
      if (!st) state = "wait";
    }
    if (t >= v.end) state = "home";
    if (state === "go") toSchool++;
    if (state === "ret") returning++;
    if (state === "serve") serving++;
    if (state === "go" || state === "ret") moving++;
    const isDone = state === "home" && t > 0;
    if (dx !== 0) v.flip = dx < 0;
    if (isDone !== v.done || v._flip !== v.flip) {
      v.marker.setIcon(vanIcon(color(v.d), v.v, v.flip, isDone)); v.done = isDone; v._flip = v.flip;
    }
    v.marker.setLatLng(pos);
  }
  const got = new Set();
  schoolMk.forEach((mk, s) => {
    const a = plan.arr.get(s);
    const has = a && t >= a.t;
    mk.setStyle({ color: a ? color(a.d) : "#9a9a96", weight: 2.5, fillColor: has ? color(a.d) : schoolFill() });
    mk.setRadius(has ? 7 : 6);
    if (has) { done++; got.add(s); if (S.playing && !gotPrev.has(s)) ripple(s, color(a.d)); }
    mk.setTooltipContent(NODES[M + s].name + (a ? ` — Granmax ${a.v}, tiba ${clockStr(a.t)} (t = ${n1(a.t)} mnt)` : ""));
  });
  gotPrev = got;
  const past = events.filter((e) => e.t <= t + 1e-9);
  const recent = past.length ? past[past.length - 1] : null;
  let line = 0;
  if (t >= plan.T) line = 7;
  else if (t <= 0) line = 0;
  else if (recent && recent.kind === "arr" && t - recent.t < 1.0) line = 4;
  else if (serving) line = 5;
  else if (toSchool) line = 3;
  else if (returning) line = 6;
  else line = 1;
  highlight(line);
  const msgs = ["Makanan selesai dimasak, semua Granmax siap berangkat bersamaan.",
    "Tiap Granmax menjalankan rutenya sendiri secara paralel.", "",
    "Granmax berjalan ke sekolah berikutnya mengikuti jalan asli.",
    recent && recent.kind === "arr" ? `${evText(recent)} pada ${clockStr(recent.t)} (t = ${n1(recent.t)} ≤ ${DATA.max_time} mnt ✓).` : "",
    `Makanan diturunkan, Granmax berhenti ${DATA.service} menit di sekolah.`,
    "Semua sekolah di rute sudah dilayani, Granmax kembali ke SPPG.",
    `Selesai. Total ${plan.km.toLocaleString("id-ID")} km → Rp${plan.cost.toLocaleString("id-ID")}.`];
  setMsg(msgs[line]);
  setInfo({ "Jam": clockStr(t), "t (menit)": n1(t), "Sekolah terlayani": `${done}/${N}`,
    "Granmax di jalan": moving, "Granmax sedang drop": serving, "Jarak ditempuh": `${n1(km)} / ${plan.km.toLocaleString("id-ID")} km`,
    "Biaya bensin (rute ini)": `Rp${plan.cost.toLocaleString("id-ID")}`, "Rata-rata tiba": `${plan.mean.toLocaleString("id-ID")} mnt`,
    "Sekolah terakhir tiba": `${plan.makespan.toLocaleString("id-ID")} mnt` });
  $("log").innerHTML = past.slice(-40).reverse()
    .map((e) => `<div><span class="t">${clockStr(e.t)}</span><i style="background:${color(e.v.d)}"></i><span>${esc(evText(e))}</span></div>`).join("");
  $("hud").innerHTML = `<div class="sm">${esc(label(S.algoRoute))} · pengiriman</div><div class="big">${clockStr(t)}</div>
    <div class="sm">t = ${n1(t)} mnt · ${done}/${N} sekolah terlayani · ${n1(km)} km</div>
    <div class="bar"><i></i></div><div class="ok">✓ Semua sekolah terlayani</div>`;
  $("scrub").max = Math.ceil(plan.T * 10); $("scrub").value = Math.round(t * 10);
  $("pos").textContent = `t = ${n1(t)} / ${n1(plan.T)} mnt`;
  setProgress(plan.T ? t / plan.T : 1);
}

// ------------------------------------------------------------------ kontrol
function render() { if (isSearchStage()) drawSearch(); else drawDelivery(); }
function setPlaying(p) {
  S.playing = p;
  $("bPlay").innerHTML = p ? ICON.pause : ICON.play;
  $("bPlay").setAttribute("aria-label", p ? "Jeda" : "Putar");
  if (p) { S.last = performance.now(); S.acc = 0; requestAnimationFrame(tick); }
}
function atEnd() {
  return isSearchStage() ? S.frame >= currentSet().frames.length - 1 : S.t >= plan.T;
}
function tick(now) {
  if (!S.playing) return;
  const dt = Math.min(0.25, (now - S.last) / 1000); S.last = now;
  const sp = +$("speed").value;
  if (isSearchStage()) {
    S.acc += dt * FPS[sp];
    if (S.acc >= 1) { S.frame = Math.min(S.frame + Math.floor(S.acc), currentSet().frames.length - 1); S.acc %= 1; render(); }
  } else {
    S.t = Math.min(plan.T, S.t + dt * MPS[sp]); render();
  }
  if (atEnd()) { setPlaying(false); return; }
  requestAnimationFrame(tick);
}
function step(dir) {
  setPlaying(false);
  if (isSearchStage()) {
    S.frame = Math.max(0, Math.min(currentSet().frames.length - 1, S.frame + dir));
  } else {
    const times = [0, ...events.map((e) => e.t), plan.T];
    S.t = dir > 0 ? (times.find((x) => x > S.t + 1e-6) ?? plan.T)
                  : ([...times].reverse().find((x) => x < S.t - 1e-6) ?? 0);
  }
  render();
}
$("bPlay").onclick = () => { if (!S.playing && atEnd()) { S.frame = 0; S.t = 0; gotPrev = new Set(); } setPlaying(!S.playing); };
$("bFwd").onclick = () => step(1);
$("bBack").onclick = () => step(-1);
$("bReset").onclick = () => { setPlaying(false); S.frame = 0; S.t = 0; render(); };
$("scrub").oninput = () => { setPlaying(false); if (isSearchStage()) S.frame = +$("scrub").value; else S.t = +$("scrub").value / 10; render(); };
$("speed").oninput = () => { store.set("speed", $("speed").value); speedLabel(); };
$("clock0").onchange = render;
document.addEventListener("keydown", (e) => {
  if (["INPUT", "SELECT"].includes(e.target.tagName) && e.target.type !== "range") return;
  if (e.key === " ") { e.preventDefault(); $("bPlay").click(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
});

function enter() {
  setPlaying(false);
  populateAlgo();
  document.querySelectorAll(".tabs button").forEach((b) => {
    const on = +b.dataset.stage === S.stage;
    b.classList.toggle("on", on);
    b.setAttribute("aria-selected", String(on));
  });
  routeLayer.clearLayers(); roadLayer.clearLayers(); vanLayer.clearLayers(); fxLayer.clearLayers();
  $("logSec").style.display = isSearchStage() ? "none" : "";
  if (isSearchStage()) {
    const A = currentSet();
    S.frame = 0;
    $("codeTitle").textContent = `Pseudocode · ${label(S.algoRoute)}`;
    setCode(A.code);
    const rd = DATA.route_depot;
    $("note").textContent = `Semua ${rd.n_depots} SPPG dicari bersamaan (tiap SPPG di kemajuannya sendiri, selesai bersamaan). `
      + `Pseudocode dan penjelasan mengikuti ${rd.id}, SPPG terbesar (${rd.k} sekolah). Rute mengikuti jalan asli (OSRM).`;
  } else {
    S.t = 0;
    $("codeTitle").textContent = `Simulasi pengiriman · rute ${label(S.algoRoute)}`;
    setCode(DATA.delivery_code);
    $("note").textContent = "Garis = jalan asli (OSRM). Titik sekolah terisi warna saat makanan sudah tiba.";
    setupDelivery();
  }
  speedLabel();
  render();
}
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => { S.stage = +b.dataset.stage; enter(); });

// tautan langsung, mis. animasi.html#stage=1&algoRoute=A*&frame=30&code=0
const H = new URLSearchParams(location.hash.slice(1));
if (DATA.route[H.get("algoRoute")]) S.algoRoute = H.get("algoRoute");
if (["1", "2"].includes(H.get("stage"))) S.stage = +H.get("stage");
setCodeHidden(H.has("code") ? H.get("code") === "0" : store.get("nocode", "0") === "1");
setPlaying(false);
enter();
if (isSearchStage() && H.has("frame")) { S.frame = Math.min(+H.get("frame"), currentSet().frames.length - 1); render(); }
if (S.stage === 2 && H.has("t")) { S.t = Math.min(+H.get("t"), plan.T); render(); }
</script>
