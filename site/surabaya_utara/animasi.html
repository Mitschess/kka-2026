<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animasi Rute MBG</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #f6f6f4; --surface: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e2de;
    --accent: #2a78d6; --hl: #fff3c4; --hl-ink: #6a4b00; --code-bg: #fbfbfa;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px;
           background: var(--surface); border-bottom: 1px solid var(--line); }
  header .title { font-weight: 650; font-size: 15px; margin-right: auto; }
  header .title span { font-weight: 400; color: var(--muted); }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .tabs button { border: 0; border-radius: 0; background: transparent; padding: 6px 12px; }
  .tabs button.on { background: var(--accent); color: #fff; }
  button, select, input[type=time] { font: inherit; color: var(--ink); background: var(--surface);
           border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: #c4c4be; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  main { flex: 1; display: flex; min-height: 0; }
  #mapwrap { flex: 1; position: relative; min-width: 0; }
  #map { position: absolute; inset: 0; background: #e9ece8; }
  aside { width: 430px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--line);
          display: flex; flex-direction: column; min-height: 0; overflow: auto; }
  body.nocode aside { display: none; }
  .sec { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .sec h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  ol#code { margin: 0; padding: 6px 0; list-style: none; counter-reset: ln; background: var(--code-bg);
            border: 1px solid var(--line); border-radius: 8px;
            font: 12.5px/1.6 ui-monospace, "Cascadia Mono", Consolas, monospace; }
  ol#code li { counter-increment: ln; padding: 1px 10px 1px 0; white-space: pre-wrap; display: flex;
               border-left: 3px solid transparent; transition: background .15s; }
  ol#code li::before { content: counter(ln); width: 30px; flex-shrink: 0; text-align: right; padding-right: 10px; color: #a3a39d; }
  ol#code li.on { background: var(--hl); color: var(--hl-ink); border-left-color: #e0a800; font-weight: 600; }
  #msg { min-height: 42px; font-size: 14px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
  table#info { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  table#info td { padding: 3px 0; border-bottom: 1px dashed var(--line); }
  table#info td:last-child { text-align: right; font-weight: 600; }
  #log { max-height: 220px; overflow: auto; font-size: 13px; font-variant-numeric: tabular-nums; }
  #log div { padding: 2px 0; border-bottom: 1px dashed var(--line); }
  #log div:first-child { font-weight: 600; }
  #log .t { color: var(--muted); display: inline-block; width: 46px; }
  footer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px;
           background: var(--surface); border-top: 1px solid var(--line); }
  footer .btns { display: flex; gap: 6px; }
  footer .btns button { min-width: 40px; }
  #bPlay { background: var(--accent); color: #fff; border-color: var(--accent); min-width: 72px; }
  #scrub { flex: 1; min-width: 160px; accent-color: var(--accent); }
  #pos { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 120px; }
  footer label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  #speed { width: 110px; accent-color: var(--accent); }
  #hud { position: absolute; top: 10px; left: 56px; z-index: 500; background: rgba(255,255,255,.94);
         border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
         font-variant-numeric: tabular-nums; pointer-events: none; max-width: calc(100% - 70px); }
  #hud .big { font-size: 22px; font-weight: 700; }
  #hud .sm { color: var(--muted); font-size: 12.5px; }
  #legend { position: absolute; right: 10px; bottom: 22px; z-index: 500; background: rgba(255,255,255,.94);
            border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 12px; }
  #legend div { display: flex; align-items: center; gap: 6px; }
  #legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .depot { width: 34px; height: 22px; border-radius: 6px; color: #fff; font: 700 10px/22px system-ui, sans-serif;
           text-align: center; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
  .van { position: relative; }
  .van svg { display: block; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.45)); transition: transform .15s; }
  .van b { position: absolute; top: -9px; right: -7px; background: #1d1d1b; color: #fff; border-radius: 9px;
           font: 700 10px/16px system-ui, sans-serif; min-width: 16px; text-align: center; padding: 0 3px; }
  .van.done { opacity: .45; }
  @media (max-width: 820px) {
    main { flex-direction: column; }
    #mapwrap { min-height: 55vh; }
    aside { width: auto; border-left: 0; border-top: 1px solid var(--line); max-height: 45vh; }
    #hud { left: 50px; }
    #hud .big { font-size: 18px; }
    #legend { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="title">Animasi Rute MBG <span id="sub"></span></div>
  <div class="tabs" role="tablist">
    <button data-stage="1" class="on" role="tab">1 · Alokasi SPPG</button>
    <button data-stage="2" role="tab">2 · Rute terbaik</button>
    <button data-stage="3" role="tab">3 · Pengiriman</button>
  </div>
  <label>Algoritma <select id="algo" aria-label="Algoritma"></select></label>
  <button id="toggleCode" aria-pressed="false">Sembunyikan kode</button>
</header>
<main>
  <div id="mapwrap">
    <div id="map" aria-label="Peta rute"></div>
    <div id="hud"></div>
    <div id="legend"></div>
  </div>
  <aside id="panel">
    <div class="sec">
      <h3 id="codeTitle">Pseudocode</h3>
      <ol id="code"></ol>
    </div>
    <div class="sec">
      <h3>Penjelasan</h3>
      <div id="msg"></div>
      <div class="note" id="note"></div>
    </div>
    <div class="sec">
      <h3>Nilai</h3>
      <table id="info"></table>
    </div>
    <div class="sec" id="logSec" style="display:none">
      <h3>Kejadian <label style="float:right;text-transform:none;letter-spacing:0;font-weight:400">
        selesai masak jam <input type="time" id="clock0" value="06:00" style="padding:1px 4px"></label></h3>
      <div id="log"></div>
    </div>
  </aside>
</main>
<footer>
  <div class="btns">
    <button id="bReset" title="Ulang dari awal" aria-label="Ulang">⏮</button>
    <button id="bBack" title="Langkah sebelumnya" aria-label="Mundur">◀</button>
    <button id="bPlay" title="Putar / jeda (spasi)">▶ Putar</button>
    <button id="bFwd" title="Langkah berikutnya" aria-label="Maju">▶|</button>
  </div>
  <input type="range" id="scrub" min="0" max="100" value="0" aria-label="Posisi animasi">
  <span id="pos"></span>
  <label>Kecepatan <input type="range" id="speed" min="0" max="9" value="4" aria-label="Kecepatan"></label>
</footer>

<script>
window.addEventListener("error", (e) => {
  const b = document.createElement("div");
  b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#c4314b;color:#fff;padding:8px 16px;font:13px system-ui";
  b.textContent = "Error: " + e.message + (typeof L === "undefined" ? " — Leaflet gagal dimuat, cek koneksi internet." : "");
  document.body.appendChild(b); document.title = "ERROR " + e.message;
});
</script>

const MPS = [0.25, 0.5, 1, 1.5, 2, 3, 4, 6, 8, 12];          // tahap 2: menit simulasi per detik
const color = (d) => C[d % C.length];
const ll = (i) => [NODES[i].lat, NODES[i].lon];

const store = {
  get(k, def) { try { const v = localStorage.getItem("mbg-anim-" + k); return v === null ? def : v; } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem("mbg-anim-" + k, v); } catch (e) { /* abaikan */ } },
};

const S = { stage: 1, algoAlloc: "SA", algoRoute: "A*", frame: 0, t: 0, playing: false, last: 0, acc: 0 };
const isSearchStage = () => S.stage === 1 || S.stage === 2;
const groupFor = (stage) => (stage === 2 ? DATA.route : DATA.alloc);
const algoKeyFor = (stage) => (stage === 2 ? "algoRoute" : "algoAlloc");
const currentSet = () => groupFor(S.stage)[S[algoKeyFor(S.stage)]];

// ------------------------------------------------------------------ peta
const map = L.map("map", { preferCanvas: true, zoomSnap: 0.25 });
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",
  { maxNativeZoom: 16, maxZoom: 19, attribution: "Tiles &copy; Esri" }).addTo(map);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}",
  { maxNativeZoom: 16, maxZoom: 19, opacity: 0.8 }).addTo(map);
map.fitBounds(L.latLngBounds(NODES.map((n) => [n.lat, n.lon])).pad(0.08));

const roadLayer = L.layerGroup().addTo(map);
const routeLayer = L.layerGroup().addTo(map);
const schoolLayer = L.layerGroup().addTo(map);
const depotLayer = L.layerGroup().addTo(map);
const vanLayer = L.layerGroup().addTo(map);

const schoolMk = [];
for (let s = 0; s < N; s++) {
  const mk = L.circleMarker(ll(M + s), { radius: 6, weight: 2.5, color: "#9a9a96", fillColor: "#ffffff", fillOpacity: 1 })
    .bindTooltip(NODES[M + s].name).addTo(schoolLayer);
  schoolMk.push(mk);
}
for (let d = 0; d < M; d++) {
  const short = NODES[d].id.replace("SPPG-", "");
  L.marker(ll(d), { icon: L.divIcon({ className: "", html: `<div class="depot" style="background:${color(d)}">${short}</div>`,
    iconSize: [34, 22], iconAnchor: [17, 11] }), zIndexOffset: 1000 })
    .bindTooltip(`${NODES[d].id}: ${NODES[d].name}`).addTo(depotLayer);
}
$("legend").innerHTML = NODES.slice(0, M).map((n, d) => `<div><i style="background:${color(d)}"></i>${n.id}</div>`).join("")
  + `<div><i style="background:#fff;border:2px solid #9a9a96"></i>belum dilayani</div>`;

// ------------------------------------------------------------------ UI umum
$("sub").textContent = `· ${DATA.instance} (${M} SPPG, ${N} sekolah, maks ${DATA.Q} sekolah/Granmax, w = ${DATA.w})`;
S.algoAlloc = store.get("algoAlloc", "SA");
if (!DATA.alloc[S.algoAlloc]) S.algoAlloc = Object.keys(DATA.alloc)[0];
S.algoRoute = store.get("algoRoute", "A*");
if (!DATA.route[S.algoRoute]) S.algoRoute = Object.keys(DATA.route)[0];
function populateAlgo() {
  const grp = groupFor(S.stage), key = algoKeyFor(S.stage);
  $("algo").innerHTML = "";
  for (const a of Object.keys(grp)) $("algo").add(new Option(a, a));
  $("algo").value = S[key];
}
$("speed").value = store.get("speed", "4");

function setCode(lines) {
  $("code").innerHTML = lines.map((l) => `<li>${l.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</li>`).join("");
}
function highlight(line) {
  [...$("code").children].forEach((li, i) => li.classList.toggle("on", i === line));
  const on = $("code").children[line];
  if (on && !document.body.classList.contains("nocode")) on.scrollIntoView({ block: "nearest" });
}
function setInfo(obj) {
  $("info").innerHTML = Object.entries(obj).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");
}
function setCodeHidden(hidden) {
  document.body.classList.toggle("nocode", hidden);
  $("toggleCode").textContent = hidden ? "Tampilkan kode" : "Sembunyikan kode";
  $("toggleCode").setAttribute("aria-pressed", String(hidden));
  store.set("nocode", hidden ? "1" : "0");
  setTimeout(() => map.invalidateSize(), 50);
}
$("toggleCode").onclick = () => setCodeHidden(!document.body.classList.contains("nocode"));

// ------------------------------------------------------------------ tahap 1: pencarian
// geometri jalan asli per ruas a -> b (OSRM); garis lurus hanya kalau datanya tidak ada
const LEGS = DATA.legs || {};
const leg = (a, b) => LEGS[a + "-" + b] || [ll(a), ll(b)];
function routePath(r) {
  const nodes = [r[0], ...r.slice(1).map((s) => M + s), r[0]], pts = [];
  for (let k = 0; k + 1 < nodes.length; k++) {
    const g = leg(nodes[k], nodes[k + 1]);
    pts.push(...(k ? g.slice(1) : g));
  }
  return pts;
}
function drawSearch() {
  const A = currentSet(), F = A.frames, f = F[S.frame];
  const label = S[algoKeyFor(S.stage)];
  routeLayer.clearLayers();
  const owner = new Array(N).fill(-1);
  for (const r of f.r) {
    const over = r.length - 1 > DATA.Q;
    L.polyline(routePath(r), { color: color(r[0]), weight: 3.2, opacity: 0.9, dashArray: over ? "6 6" : null }).addTo(routeLayer);
    for (const s of r.slice(1)) owner[s] = r[0];
  }
  const hl = new Set(f.hl || []);
  schoolMk.forEach((mk, s) => {
    const c = owner[s] >= 0 ? color(owner[s]) : "#9a9a96";
    mk.setStyle({ color: hl.has(s) ? "#d62f2f" : c, weight: hl.has(s) ? 4 : 2.5, fillColor: "#ffffff" });
    mk.setRadius(hl.has(s) ? 10 : 6);
  });
  highlight(f.l);
  $("msg").textContent = f.m;
  setInfo(f.i);
  const fv = f.i.f !== undefined ? `f = ${f.i.f}` : "";
  const big = f.i["Biaya bensin"] || fv || "–";
  $("hud").innerHTML = `<div class="sm">${label} · langkah ${S.frame + 1}/${F.length}</div>
    <div class="big">${big}</div>
    <div class="sm">${f.i["Rata-rata tiba"] ? "rata-rata tiba " + f.i["Rata-rata tiba"] + " · " : ""}${f.i["Biaya bensin"] ? fv : ""}${f.i.Melanggar ? " · <b style='color:#c4314b'>melanggar " + f.i.Melanggar + "</b>" : ""}</div>`;
  $("scrub").max = F.length - 1; $("scrub").value = S.frame;
  $("pos").textContent = `langkah ${S.frame + 1} / ${F.length}`;
}

// ------------------------------------------------------------------ tahap 2: pengiriman
let plan = null, events = [];
function segLengths(g) {
  const out = [0];
  for (let i = 1; i < g.length; i++) {
    const dy = g[i][0] - g[i - 1][0], dx = (g[i][1] - g[i - 1][1]) * Math.cos(g[i][0] * Math.PI / 180);
    out.push(out[i - 1] + Math.hypot(dx, dy));
  }
  return out;
}
function along(seg, frac) {
  const g = seg.g, cum = seg.cum, target = frac * cum[cum.length - 1];
  let i = 1;
  while (i < cum.length - 1 && cum[i] < target) i++;
  const span = cum[i] - cum[i - 1] || 1, u = (target - cum[i - 1]) / span;
  return [g[i - 1][0] + (g[i][0] - g[i - 1][0]) * u, g[i - 1][1] + (g[i][1] - g[i - 1][1]) * u, g[i][1] - g[i - 1][1]];
}
function vanIcon(c, num, flip, done) {
  return L.divIcon({ className: "", iconSize: [30, 22], iconAnchor: [15, 14], html:
    `<div class="van${done ? " done" : ""}"><svg width="30" height="22" viewBox="0 0 30 22" style="transform:scaleX(${flip ? -1 : 1})">
      <rect x="1" y="3" width="19" height="12" rx="2.5" fill="${c}" stroke="#fff" stroke-width="1.5"/>
      <path d="M20 6.5h4.5l4 4.5v4H20z" fill="${c}" stroke="#fff" stroke-width="1.5"/>
      <rect x="21.5" y="8" width="3.2" height="3" fill="#dff1ff"/>
      <circle cx="7" cy="17" r="3" fill="#222" stroke="#fff" stroke-width="1.2"/>
      <circle cx="23" cy="17" r="3" fill="#222" stroke="#fff" stroke-width="1.2"/></svg><b>${num}</b></div>` });
}
function clockStr(t) {
  const [h, m] = ($("clock0").value || "06:00").split(":").map(Number);
  const tot = Math.floor(h * 60 + m + t + 1e-6);
  return String(Math.floor(tot / 60) % 24).padStart(2, "0") + ":" + String(tot % 60).padStart(2, "0");
}
function setupDelivery() {
  plan = DATA.alloc[S.algoAlloc].delivery;
  roadLayer.clearLayers(); vanLayer.clearLayers(); events = [];
  for (const v of plan.veh) {
    for (const seg of v.segs) {
      seg.cum = segLengths(seg.g);
      L.polyline(seg.g, { color: color(v.d), weight: 4, opacity: 0.35, interactive: false }).addTo(roadLayer);
    }
    v.marker = L.marker(ll(v.d), { icon: vanIcon(color(v.d), v.v, false, false), zIndexOffset: 2000 })
      .bindTooltip(`Granmax ${v.v} (${NODES[v.d].id})`).addTo(vanLayer);
    v.flip = false; v.done = false;
    for (const st of v.stops) {
      events.push({ t: st.arr, kind: "arr", v, s: st.s });
      events.push({ t: st.dep, kind: "dep", v, s: st.s });
    }
    events.push({ t: 0, kind: "go", v });
    events.push({ t: v.end, kind: "back", v });
  }
  events.sort((a, b) => a.t - b.t || (a.kind === "go" ? -1 : 1));
  plan.T = Math.max(...plan.veh.map((v) => v.end));
  plan.arr = new Map(plan.veh.flatMap((v) => v.stops.map((st) => [st.s, { t: st.arr, d: v.d, v: v.v }])));
}
function evText(e) {
  const g = `Granmax ${e.v.v}`;
  if (e.kind === "go") return `${g} berangkat dari ${NODES[e.v.d].id}`;
  if (e.kind === "arr") return `${g} tiba di ${NODES[M + e.s].name}`;
  if (e.kind === "dep") return `${g} selesai drop di ${NODES[M + e.s].name}`;
  return `${g} kembali ke ${NODES[e.v.d].id}`;
}
function drawDelivery() {
  const t = S.t;
  let moving = 0, toSchool = 0, returning = 0, serving = 0, done = 0, km = 0;
  for (const v of plan.veh) {
    let pos = ll(v.d), state = "idle", dx = 0;
    for (const seg of v.segs) {
      if (t >= seg.t1) { pos = ll(seg.b); km += seg.km; state = seg.b >= M ? "serve" : "home"; continue; }
      if (t >= seg.t0) {
        const p = along(seg, (t - seg.t0) / (seg.t1 - seg.t0 || 1));
        pos = [p[0], p[1]]; dx = p[2]; km += seg.km * (t - seg.t0) / (seg.t1 - seg.t0 || 1);
        state = seg.b >= M ? "go" : "ret";
      }
      break;
    }
    if (state === "serve") {
      const st = v.stops.find((x) => t >= x.arr && t < x.dep);
      if (!st) state = "wait";
    }
    if (t >= v.end) state = "home";
    if (state === "go") toSchool++;
    if (state === "ret") returning++;
    if (state === "serve") serving++;
    if (state === "go" || state === "ret") moving++;
    const isDone = state === "home" && t > 0;
    if (dx !== 0) v.flip = dx < 0;
    if (isDone !== v.done || v._flip !== v.flip) {
      v.marker.setIcon(vanIcon(color(v.d), v.v, v.flip, isDone)); v.done = isDone; v._flip = v.flip;
    }
    v.marker.setLatLng(pos);
  }
  schoolMk.forEach((mk, s) => {
    const a = plan.arr.get(s);
    const got = a && t >= a.t;
    mk.setStyle({ color: a ? color(a.d) : "#9a9a96", weight: 2.5, fillColor: got ? color(a.d) : "#ffffff" });
    mk.setRadius(got ? 7 : 6);
    if (got) done++;
    mk.setTooltipContent(NODES[M + s].name + (a ? ` — Granmax ${a.v}, tiba ${clockStr(a.t)} (t = ${a.t.toFixed(1)} mnt)` : ""));
  });
  const past = events.filter((e) => e.t <= t + 1e-9);
  const recent = past.length ? past[past.length - 1] : null;
  let line = 0;
  if (t >= plan.T) line = 7;
  else if (t <= 0) line = 0;
  else if (recent && recent.kind === "arr" && t - recent.t < 1.0) line = 4;
  else if (serving) line = 5;
  else if (toSchool) line = 3;
  else if (returning) line = 6;
  else line = 1;
  highlight(line);
  const msgs = ["Makanan selesai dimasak, semua Granmax siap berangkat bersamaan.",
    "Tiap Granmax menjalankan rutenya sendiri secara paralel.", "",
    "Granmax berjalan ke sekolah berikutnya mengikuti jalan asli.",
    recent && recent.kind === "arr" ? `${evText(recent)} pada ${clockStr(recent.t)} (t = ${recent.t.toFixed(1)} ≤ ${DATA.max_time} mnt ✓).` : "",
    `Makanan diturunkan, Granmax berhenti ${DATA.service} menit di sekolah.`,
    "Semua sekolah di rute sudah dilayani, Granmax kembali ke SPPG.",
    `Selesai. Total ${plan.km} km → Rp${plan.cost.toLocaleString("id-ID")}.`];
  $("msg").textContent = msgs[line];
  setInfo({ "Jam": clockStr(t), "t (menit)": t.toFixed(1), "Sekolah terlayani": `${done}/${N}`,
    "Granmax di jalan": moving, "Granmax sedang drop": serving, "Jarak ditempuh": `${km.toFixed(1)} / ${plan.km} km`,
    "Biaya bensin (rute ini)": `Rp${plan.cost.toLocaleString("id-ID")}`, "Rata-rata tiba": `${plan.mean} mnt`,
    "Sekolah terakhir tiba": `${plan.makespan} mnt` });
  $("log").innerHTML = past.slice(-40).reverse()
    .map((e) => `<div><span class="t">${clockStr(e.t)}</span>${evText(e)}</div>`).join("");
  $("hud").innerHTML = `<div class="sm">${S.algoAlloc} · pengiriman</div><div class="big">${clockStr(t)}</div>
    <div class="sm">t = ${t.toFixed(1)} mnt · ${done}/${N} sekolah terlayani · ${km.toFixed(1)} km</div>`;
  $("scrub").max = Math.ceil(plan.T * 10); $("scrub").value = Math.round(t * 10);
  $("pos").textContent = `t = ${t.toFixed(1)} / ${plan.T.toFixed(1)} mnt`;
}

// ------------------------------------------------------------------ kontrol
function render() { if (isSearchStage()) drawSearch(); else drawDelivery(); }
function setPlaying(p) {
  S.playing = p;
  $("bPlay").textContent = p ? "⏸ Jeda" : "▶ Putar";
  if (p) { S.last = performance.now(); S.acc = 0; requestAnimationFrame(tick); }
}
function atEnd() {
  return isSearchStage() ? S.frame >= currentSet().frames.length - 1 : S.t >= plan.T;
}
function tick(now) {
  if (!S.playing) return;
  const dt = Math.min(0.25, (now - S.last) / 1000); S.last = now;
  const sp = +$("speed").value;
  if (isSearchStage()) {
    S.acc += dt * FPS[sp];
    if (S.acc >= 1) { S.frame = Math.min(S.frame + Math.floor(S.acc), currentSet().frames.length - 1); S.acc %= 1; render(); }
  } else {
    S.t = Math.min(plan.T, S.t + dt * MPS[sp]); render();
  }
  if (atEnd()) { setPlaying(false); return; }
  requestAnimationFrame(tick);
}
function step(dir) {
  setPlaying(false);
  if (isSearchStage()) {
    S.frame = Math.max(0, Math.min(currentSet().frames.length - 1, S.frame + dir));
  } else {
    const times = [0, ...events.map((e) => e.t), plan.T];
    S.t = dir > 0 ? (times.find((x) => x > S.t + 1e-6) ?? plan.T)
                  : ([...times].reverse().find((x) => x < S.t - 1e-6) ?? 0);
  }
  render();
}
$("bPlay").onclick = () => { if (!S.playing && atEnd()) { S.frame = 0; S.t = 0; } setPlaying(!S.playing); };
$("bFwd").onclick = () => step(1);
$("bBack").onclick = () => step(-1);
$("bReset").onclick = () => { setPlaying(false); S.frame = 0; S.t = 0; render(); };
$("scrub").oninput = () => { setPlaying(false); if (isSearchStage()) S.frame = +$("scrub").value; else S.t = +$("scrub").value / 10; render(); };
$("speed").oninput = () => store.set("speed", $("speed").value);
$("clock0").onchange = render;
document.addEventListener("keydown", (e) => {
  if (["INPUT", "SELECT"].includes(e.target.tagName) && e.target.type !== "range") return;
  if (e.key === " ") { e.preventDefault(); $("bPlay").click(); }
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
});

function enter() {
  setPlaying(false);
  populateAlgo();
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", +b.dataset.stage === S.stage));
  routeLayer.clearLayers(); roadLayer.clearLayers(); vanLayer.clearLayers();
  $("logSec").style.display = S.stage === 3 ? "" : "none";
  if (isSearchStage()) {
    const A = currentSet();
    S.frame = 0;
    const label = S[algoKeyFor(S.stage)];
    $("codeTitle").textContent = `Pseudocode · ${label}`;
    setCode(A.code);
    if (S.stage === 2) {
      const rd = DATA.route_depot;
      $("note").textContent = `Sub-masalah nyata: ${rd.id} (${rd.name}), ${rd.k} sekolah dari penugasan terbaik `
        + "Bagian B. Rute mengikuti jalan asli (OSRM).";
    } else {
      $("note").textContent = "Rute tiap SPPG dihitung optimal (Router) di setiap langkah, jadi peta selalu "
        + `solusi lengkap. Run: seed ${DATA.seed}, ${DATA.budget.toLocaleString("id-ID")} evaluasi.`;
    }
  } else {
    S.t = 0;
    $("codeTitle").textContent = `Simulasi pengiriman · rute terbaik ${S.algoAlloc}`;
    setCode(DATA.delivery_code);
    $("note").textContent = "Garis = jalan asli (OSRM). Titik sekolah terisi warna saat makanan sudah tiba.";
    setupDelivery();
  }
  render();
}
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => { S.stage = +b.dataset.stage; enter(); });
$("algo").onchange = () => {
  const key = algoKeyFor(S.stage);
  S[key] = $("algo").value;
  store.set(key, S[key]);
  enter();
};

// tautan langsung, mis. animasi.html#stage=2&algoRoute=A*&frame=30&code=0
const H = new URLSearchParams(location.hash.slice(1));
if (DATA.alloc[H.get("algoAlloc")]) S.algoAlloc = H.get("algoAlloc");
if (DATA.route[H.get("algoRoute")]) S.algoRoute = H.get("algoRoute");
if (["1", "2", "3"].includes(H.get("stage"))) S.stage = +H.get("stage");
setCodeHidden(H.has("code") ? H.get("code") === "0" : store.get("nocode", "0") === "1");
enter();
if (isSearchStage() && H.has("frame")) { S.frame = Math.min(+H.get("frame"), currentSet().frames.length - 1); render(); }
if (S.stage === 3 && H.has("t")) { S.t = Math.min(+H.get("t"), plan.T); render(); }
</script>
</body>
